services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2m

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      clamav: {condition: service_healthy}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      CLAMAV_HOST: clamav
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      clamav: {condition: service_healthy}
    env_file: [.env]
    environment:
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      CLAMAV_HOST: clamav

volumes:
  mongo_data:
  redis_data:
  clamav_data:
